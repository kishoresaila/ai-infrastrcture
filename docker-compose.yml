services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports: ["11434:11434"]
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # --- NVIDIA GPU (optional): uncomment
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports: ["6333:6333"]
    volumes:
      - ./vector_store:/qdrant/storage
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: infra-backend
    ports: ["8000:8000"]
    environment:
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      LLM_MODEL: qwen3:8b
      EMBED_MODEL: nomic-embed-text
      DOCS_DIR: /documents
    volumes:
      - ./documents:/documents
    depends_on: [ollama, qdrant]
    restart: unless-stopped

  frontend:                      # React UI (http://localhost:3000)
    build: ./frontend-react
    container_name: infra-frontend
    ports: ["3000:80"]
    depends_on: [backend]
    restart: unless-stopped

  frontend-streamlit:            # old Streamlit UI, optional: docker compose --profile streamlit up -d
    profiles: ["streamlit"]
    build: ./frontend
    container_name: infra-streamlit
    ports: ["8501:8501"]
    environment:
      API_URL: http://backend:8000
    depends_on: [backend]

volumes:
  ollama_data:
